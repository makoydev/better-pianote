<!doctype html>
<html lang="en" data-scale="large">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tonic" />
    <meta name="description" content="Tonic: learn piano properly. Read notes, build chords, play scales and progressions with your own keyboard." />
    <title>Tonic · learn piano properly</title>
    <style>
      /* Shown while the app starts (replaced as soon as it renders). */
      html, body { background: #0d0c24; margin: 0; }
      .boot { display: flex; min-height: 100dvh; align-items: center; justify-content: center; }
      .boot span { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(255,255,255,.1); border-top-color: #ffc857; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
